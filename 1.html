<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
    <title>Digital Rosary</title>
    <link rel="shortcut icon" type="image/x-icon" href="favicon.png">
    <style>
      body {
        color: white;
        height: 100vh;
        display: flex;
        text-align: center;
        align-items: center;
        justify-content: center;
        font-family: Arial, sans-serif;
        background: linear-gradient(to right, #2c3e50, #3498db);
      }
      .container {
        padding: 30px;
        border-radius: 15px;
        background: rgba(255, 255, 255, 0.1);
        box-shadow: 0 5px 15px rgba(0,0,0,0.3);
      }
      h1 {
        display: none;
        font-size: 2rem;
        margin-bottom: 20px;
      }
      #count {
        margin: 20px 0;
        font-size: 3rem;
        font-weight: bold;
      }
      button {
        border: none;
        margin: 10px;
        cursor: pointer;
        transition: 0.3s;
        font-size: 1.2rem;
        padding: 10px 20px;
        border-radius: 10px;
      }
      .count-btn {
        color: white;
        background: #27ae60;
      }
      .count-btn:hover {
        background: #2ecc71;
      }
      .reset-btn {
        color: white;
        background: #e74c3c;
      }
      .reset-btn:hover {
        background: #c0392b;
      }
    </style>
</head>
<body>
  <div class="container">
    <h1>Digital Rosary</h1>
    <div id="count">0</div>
    <button class="count-btn" onclick="increaseCount()">Count</button>
    <button class="reset-btn" onclick="resetCount()">Reset</button>
  </div>
  <script>
    let count = 0;

    const get = (k, d) => JSON.parse(localStorage.getItem(`rosary-${k}`)) ?? d;
    const set = (k, v) => localStorage.setItem(`rosary-${k}`, JSON.stringify(v));

    const increaseCount = () => {
      let { counts } = get('counts', {counts: 0});
      counts++;
      set('counts', {counts});
      document.querySelector("#count").innerText = counts;
    }

    function resetCount() {
      counts = 0;
      set('counts', {counts});
      document.querySelector("#count").innerText = counts;
    }

    (e => {
        let { counts } = get('counts', {counts: 0});
        document.querySelector("#count").innerText = counts;
    })();
  </script>
</body>
</html>
